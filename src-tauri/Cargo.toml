[package]
name = "perspective-dieline-generator"
version = "1.0.0"
description = "Local-first perspective package image to editable 2D dieline generator"
authors = ["Perspective Dieline Generator"]
edition = "2021"

[lib]
name = "perspective_dieline_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
